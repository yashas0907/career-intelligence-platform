services:
  backend:
    build: ./backend
    container_name: career-intel-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/backend_data/career_intel.db
      - LOG_FILE=/app/backend_data/app.log
    volumes:
      - backend_data:/app/backend_data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: career-intel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  backend_data:

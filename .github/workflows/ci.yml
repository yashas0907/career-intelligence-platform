name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      EMBEDDING_BACKEND: hashing
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CI-minimal, no torch/sentence-transformers)
        run: |
          cd backend
          pip install -r requirements-ci.txt
      - name: Run tests (unit + API + extraction evaluation)
        run: python -m pytest tests -v
      - name: Extraction quality report
        run: python tests/eval_extraction.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

services:
  # Single-service deployment: API + embedded frontend on one port.
  # Build from repo root: docker compose -f deploy/compose.yml up --build
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: career-intel-app
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite:////app/backend_data/career_intel.db
      - LOG_FILE=/app/backend_data/app.log
    volumes:
      - app_data:/app/backend_data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_data:
